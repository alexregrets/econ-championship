[project]
name = "econ-tournament"
version = "0.1.0"
description = "Econometrics Championship — Cournot tournament platform for econometrics education"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.29.1",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    # Выгрузка датасета в XLSX. Лёгкий (~250 КБ), в отличие от научного
    # стека, поэтому единственный, кто уезжает в runtime ради экспорта.
    "openpyxl>=3.1",
    "pydantic-settings>=2.14.2",
    "sqlmodel>=0.0.38",
    "streamlit>=1.59.0",
    "textual>=8.2.7",
]

[dependency-groups]
# numpy и statsmodels — только для тестов, и намеренно не в runtime.
# Генератор данных в core/ стоит на голой стандартной библиотеке: ядро едет
# на VPS в 512 МБ, и тащить туда научный стек ради того, что нужно один раз
# при проверке, незачем. Тестам же statsmodels необходим по существу — именно
# им проверяется, что в сгенерированных данных действительно лежит та
# закономерность, которую студент должен найти (White, Breusch-Godfrey, VIF).
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "numpy>=2.0",
    "statsmodels>=0.14",
    # Стабы, а не override в [tool.mypy]: экспорт студентам — место, где
    # опечатка в имени листа обнаружится на турнире, а не в проверке типов.
    "types-openpyxl>=3.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["textual.*", "streamlit.*", "pandas.*"]
ignore_missing_imports = true

# statsmodels стабов не публикует и py.typed не несёт — types-пакета для него
# не существует, в отличие от openpyxl. Живёт только в тестах, где проверяются
# свойства данных, а не типы, поэтому override здесь честнее заглушек.
[[tool.mypy.overrides]]
module = ["statsmodels.*"]
ignore_missing_imports = true

[tool.uv]
package = false
