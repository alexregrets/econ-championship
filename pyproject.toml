[project]
name = "econ-tournament"
version = "0.1.0"
description = "Econometrics Championship — Cournot tournament platform for econometrics education"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.29.1",
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pydantic-settings>=2.14.2",
    "sqlmodel>=0.0.38",
    "streamlit>=1.59.0",
    "textual>=8.2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["textual.*", "streamlit.*", "pandas.*"]
ignore_missing_imports = true

[tool.uv]
package = false
